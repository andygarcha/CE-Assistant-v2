name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  ruff:
    name: Lint & Format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: ruff check .
      - name: Run ruff format
        run: ruff format --check .

  pyright:
    name: Type check (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install pyright -r requirements.txt
      - name: Run pyright
        run: pyright

  pytest:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Create dummy .env file
        run: |
          echo "SUPABASE_URL=https://dummy.supabase.co" > .env
          echo "SUPABASE_SECRET_KEY=dummy" >> .env
      - name: Run pytest
        run: pytest --ignore=tests/integration
  
  in_ce:
    name: In CE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check IN_CE set to True
        run: |
          python -c "from utils.channels import IN_CE; assert IN_CE is True, 'IN_CE must be True'"

  smoke_test:
    name: Import smoke test (main.py / scraper_main.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Create dummy .env file
        run: |
          echo "SUPABASE_URL=https://dummy.supabase.co" > .env
          echo "SUPABASE_SECRET_KEY=dummy" >> .env
          echo "DISCORD_BOT_TOKEN=dummy_token" >> .env
          echo "DISCORD_GUILD_ID=123456789" >> .env
      - name: Run import smoke test
        run: python scripts/smoke_test_imports.py

  pip_audit:
    name: Dependency vulnerability scan (pip-audit)
    runs-on: ubuntu-latest
    # Report-only for now: 47 pre-existing vulnerabilities (mostly outdated
    # aiohttp) haven't been triaged yet. Flip continue-on-error to false once
    # they're resolved, so this becomes a real merge gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        run: pip-audit -r requirements.txt

  coverage:
    name: Coverage floor (pytest-cov)
    runs-on: ubuntu-latest
    # Report-only for now: confirm this passes cleanly on real PRs before
    # flipping continue-on-error to false to make it a hard gate. Floor is
    # set a few points below the current ~55% production-code coverage
    # (tests/, test.py, and main.py excluded via [tool.coverage.run] in
    # pyproject.toml) so normal fluctuation doesn't flap CI -- raise it
    # over time as coverage genuinely improves.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Create dummy .env file
        run: |
          echo "SUPABASE_URL=https://dummy.supabase.co" > .env
          echo "SUPABASE_SECRET_KEY=dummy" >> .env
      - name: Run pytest with coverage floor
        run: pytest --ignore=tests/integration --cov=. --cov-report=term --cov-fail-under=50
